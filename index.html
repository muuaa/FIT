<!doctype html>
<html lang="en" class="dark intro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Better Together" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Better Together</title>
    <meta name="description" content="Your days, plans, health, money and home, shared by two." />
    <!--
      Paint the dark background before anything else loads (no white flash), and play a short intro
      that hides the first moments of loading. It stays up until the app says it's ready (and at
      least long enough to finish), then fades into the app. Pure CSS, so it runs instantly.
    -->
    <style>
      html, body { background: #07080d; color-scheme: dark; margin: 0; }
      html.intro #root { opacity: 0; }
      #root { transition: opacity 0.38s ease; }
      #intro {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #07080d;
        transition: opacity 0.42s ease;
      }
      #intro.out { opacity: 0; pointer-events: none; }
      #intro .mark { width: 128px; height: 128px; transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease; }
      #intro.out .mark { transform: scale(1.12); opacity: 0; }
      #intro .ring { stroke-dasharray: 943 943; stroke-dashoffset: 943; animation: bt-draw 0.7s 0.12s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #intro .spark { transform-box: fill-box; transform-origin: center; transform: scale(0) rotate(-60deg); animation: bt-pop 0.5s 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      #intro .glow { opacity: 0; animation: bt-glow 0.9s 0.2s ease-out forwards; }
      @keyframes bt-draw { to { stroke-dashoffset: 183; } }
      @keyframes bt-pop { to { transform: scale(1) rotate(0deg); } }
      @keyframes bt-glow { 50% { opacity: 1; } to { opacity: 0.75; } }
      /* In the Android app, Android has already drawn the logo: show it finished and still, so the
         hand-over is seamless, then fade into the app. */
      #intro.static .ring { animation: none; stroke-dashoffset: 183; }
      #intro.static .spark { animation: none; transform: none; }
      #intro.static .glow { animation: none; opacity: 0.75; }
      @media (prefers-reduced-motion: reduce) {
        #intro .ring { animation-duration: 0.01s; animation-delay: 0s; }
        #intro .spark { animation-duration: 0.01s; animation-delay: 0s; }
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <svg class="mark" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="ibg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#1d1936" /><stop offset="1" stop-color="#07070d" /></linearGradient>
          <radialGradient id="iglow" cx="0.5" cy="0.45" r="0.55"><stop offset="0" stop-color="#a89bff" stop-opacity="0.32" /><stop offset="1" stop-color="#a89bff" stop-opacity="0" /></radialGradient>
          <linearGradient id="iring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ceff" /><stop offset="0.55" stop-color="#a89bff" /><stop offset="1" stop-color="#ff9eb5" /></linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#ibg)" />
        <rect class="glow" width="512" height="512" rx="116" fill="url(#iglow)" />
        <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="44" />
        <circle class="ring" cx="256" cy="256" r="150" fill="none" stroke="url(#iring)" stroke-width="44" stroke-linecap="round" transform="rotate(-90 256 256)" />
        <path class="spark" d="M256 186c7 44 26 63 70 70-44 7-63 26-70 70-7-44-26-63-70-70 44-7 63-26 70-70z" fill="#fff" />
      </svg>
    </div>
    <script>
      (function () {
        var start = Date.now(), ready = false, gone = false;
        var inApp = /[?&]app=/.test(location.search);
        // The Android app's own window holds its animated launch logo until the app has drawn:
        // there, skip this intro and let Android cross-fade straight into the app.
        var appWindow = !!window.BTNative;
        try { inApp = inApp || !!sessionStorage.getItem('fit.native'); } catch (e) {}
        if (inApp) document.getElementById('intro').classList.add('static');
        var MIN = inApp ? 250 : 950; // in the app the logo is already drawn; in a browser let it finish
        function hide() {
          if (gone) return;
          gone = true;
          var el = document.getElementById('intro');
          document.documentElement.classList.remove('intro');
          if (!el) return;
          el.classList.add('out');
          setTimeout(function () { el.remove(); }, 480);
        }
        // Called by the app once it has something real to show.
        window.__appReady = function () {
          if (ready) return;
          ready = true;
          if (appWindow) {
            var el = document.getElementById('intro');
            if (el) el.remove();
            document.documentElement.classList.remove('intro');
            gone = true;
            requestAnimationFrame(function () { requestAnimationFrame(function () { try { window.BTNative.ready(); } catch (e) {} }); });
            return;
          }
          var wait = Math.max(0, MIN - (Date.now() - start));
          setTimeout(function () { requestAnimationFrame(function () { requestAnimationFrame(hide); }); }, wait);
        };
        setTimeout(function () { hide(); try { window.BTNative && window.BTNative.ready(); } catch (e) {} }, 5000); // never get stuck behind the intro
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
